<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petit Bac Multijoueur</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        h1 { color: #4a5568; margin-bottom: 20px; }
        .hidden { display: none !important; }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #cbd5e0;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background-color: #667eea;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #5a67d8; }
        .avatar-picker {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 15px 0;
            font-size: 28px;
            cursor: pointer;
        }
        .avatar-option {
            padding: 5px;
            border-radius: 50%;
            border: 2px solid transparent;
            transition: transform 0.2s;
        }
        .avatar-option.selected {
            border-color: #667eea;
            transform: scale(1.1);
            background: #edf2f7;
        }
        ul { list-style: none; padding: 0; text-align: left; }
        ul li { background: #f7fafc; padding: 10px; margin: 5px 0; border-radius: 5px; display: flex; align-items: center; gap: 10px; }
        .letter-display {
            font-size: 48px;
            color: #764ba2;
            font-weight: bold;
            margin: 20px 0;
        }
        .category-group {
            text-align: left;
            margin-bottom: 15px;
        }
        .category-group label {
            font-weight: bold;
            color: #4a5568;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ÉCRAN D'ACCUEIL -->
        <div id="homeScreen">
            <h1>📝 Petit Bac Multijoueur</h1>
            <label>Choisissez votre avatar :</label>
            <div class="avatar-picker">
                <span class="avatar-option selected" onclick="selectAvatar(this, '🦊')">🦊</span>
                <span class="avatar-option" onclick="selectAvatar(this, '🐯')">🐯</span>
                <span class="avatar-option" onclick="selectAvatar(this, '🤖')">🤖</span>
                <span class="avatar-option" onclick="selectAvatar(this, '🦄')">🦄</span>
            </div>
            
            <input type="text" id="usernameInput" placeholder="Votre pseudo">
            <button onclick="createRoom()">Créer un salon</button>
            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #e2e8f0;">
            <input type="text" id="roomInput" placeholder="Code du salon" style="text-transform: uppercase;">
            <button onclick="joinRoom()" style="background-color: #48bb78;">Rejoindre un salon</button>
        </div>

        <!-- LOBBY / SALON D'ATTENTE -->
        <div id="lobbyScreen" class="hidden">
            <h2 id="roomCodeDisplay">Salon : </h2>
            <h3>Joueurs connectés :</h3>
            <ul id="playerList"></ul>
            <button id="startBtn" class="hidden" onclick="startGame()">Démarrer la partie</button>
            <p id="waitMsg" style="color: #718096; font-style: italic;">En attendant que l'hôte lance la partie...</p>
        </div>

        <!-- ÉCRAN DE JEU -->
        <div id="gameScreen" class="hidden">
            <h3>Lettre tirée :</h3>
            <div id="currentLetterDisplay" class="letter-display">?</div>
            
            <div class="category-group">
                <label>Prénom :</label>
                <input type="text" class="word-input" data-cat="prenom" placeholder="Ex: Marc">
            </div>
            <div class="category-group">
                <label>Pays / Ville :</label>
                <input type="text" class="word-input" data-cat="pays" placeholder="Ex: Maroc">
            </div>
            <div class="category-group">
                <label>Animal :</label>
                <input type="text" class="word-input" data-cat="animal" placeholder="Ex: Marmotte">
            </div>
            <div class="category-group">
                <label>Métier :</label>
                <input type="text" class="word-input" data-cat="metier" placeholder="Ex: Mécanicien">
            </div>

            <button onclick="submitAnswers()" style="background-color: #319795;">Valider mes réponses</button>
        </div>
    </div>

    <!-- SOCKET.IO CLIENT -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let selectedAvatar = '🦊';
        let currentRoom = '';

        function selectAvatar(element, avatar) {
            document.querySelectorAll('.avatar-option').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            selectedAvatar = avatar;
        }

        function createRoom() {
            const username = document.getElementById('usernameInput').value.trim();
            if (!username) return alert("Entre un pseudo !");
            socket.emit('createRoom', { username, avatar: selectedAvatar });
        }

        function joinRoom() {
            const username = document.getElementById('usernameInput').value.trim();
            const roomCode = document.getElementById('roomInput').value.trim().toUpperCase();
            if (!username || !roomCode) return alert("Entre un pseudo et un code de salon !");
            socket.emit('joinRoom', { username, roomCode, avatar: selectedAvatar });
        }

        socket.on('roomCreated', (data) => {
            currentRoom = data.roomCode;
            document.getElementById('homeScreen').classList.add('hidden');
            document.getElementById('lobbyScreen').classList.remove('hidden');
            document.getElementById('roomCodeDisplay').innerText = `Salon : ${data.roomCode}`;
            document.getElementById('startBtn').classList.remove('hidden'); // L'hôte peut démarrer
            document.getElementById('waitMsg').classList.add('hidden');
            updatePlayerList(data.players);
        });

        socket.on('roomJoined', (data) => {
            currentRoom = data.roomCode;
            document.getElementById('homeScreen').classList.add('hidden');
            document.getElementById('lobbyScreen').classList.remove('hidden');
            document.getElementById('roomCodeDisplay').innerText = `Salon : ${data.roomCode}`;
            updatePlayerList(data.players);
        });

        socket.on('updatePlayers', (players) => {
            updatePlayerList(players);
        });

        socket.on('errorMsg', (msg) => {
            alert(msg);
        });

        function updatePlayerList(players) {
            const list = document.getElementById('playerList');
            list.innerHTML = '';
            players.forEach(p => {
                const li = document.createElement('li');
                li.innerHTML = `<span>${p.avatar}</span> <strong>${p.username}</strong>`;
                list.appendChild(li);
            });
        }

       function startGame() {
            socket.emit('startGame');
        }

        // Réception du signal de démarrage de partie
        socket.on('gameStarted', (data) => {
            document.getElementById('lobbyScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            document.getElementById('currentLetterDisplay').innerText = data.letter;
            
            // Vider les champs de texte
            document.querySelectorAll('.word-input').forEach(input => input.value = '');
        });
        function submitAnswers() {function submitAnswers() {
            const answers = {};
            document.querySelectorAll('.word-input').forEach(input => {
                const category = input.getAttribute('data-cat');
                answers[category] = input.value.trim();
            });

            // Envoyer les réponses au serveur via Socket.io
            socket.emit('submitAnswers', answers);
            
            // Désactiver le bouton et afficher l'attente
            const btn = document.querySelector('#gameScreen button');
            btn.disabled = true;
            btn.innerText = "En attente des autres joueurs...";
            btn.style.backgroundColor = "#a0aec0";
        }

        socket.on('waitingForOthers', () => {
            alert("Réponses bien envoyées ! En attente des autres joueurs...");
        });

        socket.on('gameOver', (data) => {
            alert("La manche est terminée ! Tout le monde a répondu.");
            console.log("Résultats reçus :", data.answers);
        });

            const answers = {};
            document.querySelectorAll('.word-input').forEach(input => {
                const category = input.getAttribute('data-cat');
                answers[category] = input.value.trim();
            });

            // Envoyer les réponses au serveur
            socket.emit('submitAnswers', answers);
            
            // Désactiver le bouton
            const btn = document.querySelector('#gameScreen button');
            btn.disabled = true;
            btn.innerText = "En attente des autres joueurs...";
            btn.style.backgroundColor = "#a0aec0";
        }

        socket.on('waitingForOthers', () => {
            alert("Réponses bien envoyées ! En attente des autres joueurs...");
        });

        socket.on('gameOver', (data) => {
            alert("La manche est terminée !");
            console.log("Résultats :", data.answers);
        });
        }
    </script>
</body>
</html>
